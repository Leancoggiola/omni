services:
  # Imagen de producción de la API, para probar el Dockerfile en local. Necesita apps/api/.env y espera al db.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - apps/api/.env
    depends_on:
      db:
        condition: service_healthy

  # Base de desarrollo con datos persistentes (volumen pgdata). Sirve también para probar restauraciones de backup.
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omni_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Solo para tests de integración. Los datos viven en tmpfs y se borran al parar el contenedor.
  db-test:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports:
      - '127.0.0.1:${DB_TEST_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omni_test
    tmpfs:
      - /var/lib/postgresql/data
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # Solo para la suite E2E. Separada de db-test para poder correr ambas suites a la vez.
  db-e2e:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports:
      - '127.0.0.1:${DB_E2E_PORT:-5434}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omni_e2e
    tmpfs:
      - /var/lib/postgresql/data
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
