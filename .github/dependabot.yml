version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      security-npm:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - dependencies
      - security
    commit-message:
      prefix: 'fix(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    groups:
      security-actions:
        applies-to: security-updates
        patterns:
          - '*'
      actions:
        applies-to: version-updates
        patterns:
          - '*'
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: 'ci'
