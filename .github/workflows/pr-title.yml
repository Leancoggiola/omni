name: PR Title

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # El título llega por env, no interpolado en el script. Los rulesets mergean con PR_TITLE y semantic-release lee ese título.
      - name: Validar el título con la convención de commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
