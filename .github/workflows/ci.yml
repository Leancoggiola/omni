name: CI

on:
  # Solo main: los merges a develop entran por PR, que ya corre este mismo pipeline.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  # Nightly, para detectar E2E flaky y dependencias con CVEs nuevos.
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-lint-

      - run: pnpm turbo lint

      - run: pnpm --filter web check-api-paths

      - run: pnpm --filter mobile check-api-paths

      - run: pnpm --filter web check-structure

      - run: pnpm --filter mobile check-structure

      - run: pnpm format:check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit de producción (bloqueante)
        run: pnpm audit --prod --audit-level=high

      - name: Audit completo (informativo)
        continue-on-error: true
        shell: bash
        run: pnpm audit --audit-level=high | tee -a "$GITHUB_STEP_SUMMARY"

  check-types:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-check-types-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-check-types-

      - run: pnpm turbo check-types

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Contra esto corren los tests de integración. El puerto coincide con apps/api/.env.test.
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omni_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-test-

      - run: pnpm --filter api db:test:reset

      - run: pnpm turbo test:coverage

      - run: pnpm test:scripts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: apps/*/coverage/
          retention-days: 7

  e2e:
    name: E2E
    # Solo en PR y en el nightly: levantar api + web es demasiado lento para cada push.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    # Bloqueante en PRs a main; informativo en PRs a develop y en el nightly.
    continue-on-error: ${{ github.base_ref != 'main' }}
    # Fijo a 24.04: Playwright 1.58.2 no instala Chromium en ubuntu-latest (26.04). Volver a latest al subir Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Puerto y nombre de base tomados de apps/api/.env.e2e.
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omni_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - id: playwright-version
        run: echo "version=$(node -p "require('./apps/e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      # El servidor de la API arranca con tsx, así que necesita el cliente de Prisma generado.
      - run: pnpm --filter api db:generate

      - run: pnpm --filter e2e test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  build:
    name: Build
    needs: [lint, check-types, test, audit]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-build-

      - run: pnpm turbo build
