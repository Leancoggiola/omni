name: CI

on:
  # Solo main: los merges a develop entran por PR, que ya corre este mismo pipeline.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  # Nightly, para detectar E2E flaky y dependencias con CVEs nuevos.
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-lint-

      - run: pnpm turbo lint

      - run: pnpm --filter web check-api-paths

      - run: pnpm --filter mobile check-api-paths

      - run: pnpm --filter web check-structure

      - run: pnpm --filter mobile check-structure

      - run: pnpm format:check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Excepciones en auditConfig.ignoreCves de pnpm-workspace.yaml:
      # - CVE-2025-71329/CVE-2025-71330 (image-size): dependencia del bundler de
      #   mobile (metro) que pide la 1.x; el fix es 2.x.
      # - CVE-2026-93687 (braces): sin versión parcheada upstream. En el grafo
      #   --prod solo aparece bajo apps/mobile (plugin de babel de tamagui,
      #   herramienta de build); no está en api ni en web. También llega por
      #   semantic-release.
      # node-forge se fija con un override en pnpm-workspace.yaml (>=1.4.1).
      # Revisar las excepciones cuando salga un parche.
      - name: Excepciones solo en mobile (bloqueante)
        shell: bash
        run: |
          pnpm --filter '!mobile' why braces --prod --json | node -e "
            const r = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            if (!r.length) { console.error('sin proyectos evaluados'); process.exit(1); }
            const h = r.filter((p) => p.dependencies || p.devDependencies || p.optionalDependencies);
            if (h.length) { console.error('excepciones fuera de mobile: ' + h.map((p) => p.name).join(', ')); process.exit(1); }
          "

      - name: Audit de producción (bloqueante)
        run: pnpm audit --prod --audit-level=high

      - name: Audit completo (informativo)
        continue-on-error: true
        shell: bash
        run: pnpm audit --audit-level=high | tee -a "$GITHUB_STEP_SUMMARY"

  check-types:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-check-types-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-check-types-

      - run: pnpm turbo check-types

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Contra esto corren los tests de integración. El puerto coincide con apps/api/.env.test.
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omni_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-test-

      - run: pnpm --filter api db:test:reset

      - run: pnpm turbo test:coverage

      - run: pnpm test:scripts

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: apps/*/coverage/
          retention-days: 7

  e2e:
    name: E2E
    # Solo en PR y en el nightly: levantar api + web es demasiado lento para cada push.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    # Bloqueante en PRs a main; informativo en PRs a develop y en el nightly.
    continue-on-error: ${{ github.base_ref != 'main' }}
    # Fijo a 24.04: Playwright 1.58.2 no instala Chromium en ubuntu-latest (26.04). Volver a latest al subir Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Puerto y nombre de base tomados de apps/api/.env.e2e.
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omni_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - id: playwright-version
        run: echo "version=$(node -p "require('./apps/e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      # El servidor de la API arranca con tsx, así que necesita el cliente de Prisma generado.
      - run: pnpm --filter api db:generate

      - run: pnpm --filter e2e test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  build:
    name: Build
    needs: [lint, check-types, test, audit]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-build-

      - run: pnpm turbo build
