services:
  - type: web
    name: omni-api
    runtime: docker
    repo: https://github.com/Leancoggiola/omni
    branch: main
    # Entre comillas: un parser YAML 1.1 leería off como false. El deploy lo dispara release.yml.
    autoDeployTrigger: 'off'
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ORIGIN_SECRET
        sync: false
